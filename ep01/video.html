<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=1920,H=1080,RAD=Math.PI/180;
const BG='#0a1020',INK='#eef2f8',QUIET='#8a97ad',SUN='#f6f1e3',ACC='#ffd166',DROP='#7fb4ff';
const SPEC=['#ff4b4b','#ff9340','#ffe04a','#58e07a','#45a8ff','#6470ff','#a56bff'];

// ---------- maths ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const seg=(t,a,b)=>ease((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}),add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}),mul=(a,k)=>({x:a.x*k,y:a.y*k}),dot=(a,b)=>a.x*b.x+a.y*b.y;

function pw(t,ks){if(t<=ks[0][0])return ks[0][1];for(let i=0;i<ks.length-1;i++){if(t<=ks[i+1][0])return lerp(ks[i][1],ks[i+1][1],ease((t-ks[i][0])/(ks[i+1][0]-ks[i][0])))}return ks[ks.length-1][1]}

// trace a ray entering at impact parameter b (-1..1, positive = upper half) through a spherical drop
function trace(b,n,C,R,k=1,x0=-40){

function progs(p,pts){const n=pts.length-1,w=[];for(let i=0;i<n;i++)w.push(i===0?520:i===n-1?700:dist(pts[i],pts[i+1])*2.2);const tot=w.reduce((a,b)=>a+b,0);let acc=0;return w.map(x=>{const f0=acc/tot;acc+=x;return clamp((p-f0)/(x/tot))})}
// ---------- drawing ----------
function drawRay(pts,pr,c0,c1,a,lw){if(a<=0)return;g.globalAlpha=a;g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';

function text(s,x,y,size,color,alpha=1,weight=500,align='left'){if(alpha<=0)return;g.globalAlpha=clamp(alpha);g.fillStyle=color;g.font=`${weight} ${size}px Inter`;g.textAlign=align;g.textBaseline='alphabetic';g.fillText(s,x,y);g.globalAlpha=1}

function person(x,y,s,col,a=1){if(a<=0)return;g.globalAlpha=a;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=6*s;g.lineCap='round';

function angleMark(E,a,rad,col,alpha,label,lsize=44){ // angle between "straight back toward the sun" and a ray leaving down-left at a degrees
  if(alpha<=0)return;line(E.x,E.y,E.x-rad-150,E.y,QUIET,alpha,2,[10,10]);
  g.globalAlpha=clamp(alpha);g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.arc(E.x,E.y,rad,Math.PI-a*RAD,Math.PI);g.stroke();g.globalAlpha=1;
  if(label){const m=Math.PI-(a+15)*RAD;text(label,E.x+Math.cos(m)*(rad+40),E.y+Math.sin(m)*(rad+40)+lsize*0.35,lsize,col,alpha,700,'center')}}
function bow(cx,cy,ppd,a,k=1,only=null){if(a<=0)return;g.save();g.globalCompositeOperation='lighter';

  g.lineCap='round';g.lineJoin='round';g.strokeStyle='#ffffff';g.lineWidth=84*s+16;path();g.stroke();g.fillStyle='#ffffff';g.beginPath();g.arc(0,368*s,50*s+8,0,7);g.fill();

function star(x,y,r,col){g.fillStyle=col;g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*0.32:r;g.lineTo(x+Math.cos(a-Math.PI/2)*rr,y+Math.sin(a-Math.PI/2)*rr)}g.closePath();g.fill()}
// the channel mascot: x = centre, yFeet = bottom of the shoes, s = scale (1 = 714 px tall)

  S(()=>{g.beginPath();g.ellipse(-46,866,46,24,0,0,7)},'#eef2f8');S(()=>{g.beginPath();g.ellipse(46,866,46,24,0,0,7)},'#eef2f8');

  S(()=>{g.beginPath();g.ellipse(0,372,204,196,0,Math.PI,2*Math.PI);g.closePath()},o.hat||'#22252f');S(()=>{g.beginPath();g.roundRect(-212,326,424,62,28)},o.cuff||'#3a4056');
  g.lineJoin='round';g.strokeStyle='#ffffff';g.lineWidth=22;shapes.forEach(q=>{q.b();g.stroke()});shapes.forEach(q=>{q.b();g.fillStyle=q.f;g.fill()});
  [-68,68].forEach(ex=>{g.fillStyle='#1b1e2c';g.beginPath();g.ellipse(ex,452,27,35,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(ex-9,438,10,0,7);g.fill();g.beginPath();g.arc(ex+10,464,5,0,7);g.fill()});

  g.strokeStyle='#7a4a45';g.lineWidth=7;g.lineCap='round';g.beginPath();g.arc(0,496,17,0.15*Math.PI,0.85*Math.PI);g.stroke();
  g.strokeStyle='#30364a';g.lineWidth=9;g.beginPath();g.moveTo(-70,580);g.quadraticCurveTo(0,650,70,580);g.stroke();
  g.fillStyle=SKIN;g.strokeStyle=CLOTH;g.lineWidth=5;[-21,21].forEach(hx=>{g.beginPath();g.arc(hx,712,24,0,7);g.fill();g.stroke()});
  if(o.q){qmark(255,212,0.31,12);star(177,150,22,ACC);star(307,372,15,ACC)}g.restore()}
// ---------- shared: front view (what the observer sees) ----------
const A1=NS.map(n=>bowAngle(n,1)),A2=NS.map(n=>bowAngle(n,2));
const DOTS=(()=>{const r=rng(7);return Array.from({length:3200},()=>({x:r()*W,y:r()*H,v:40+r()*50}))})();
function frontView(o){ // o:{t,cx,cy,hz,ppd,mode:'none'|'red'|'all',bowA,secA,groundA,guideA,glowIn,band,dotsA}
  const {t,cx,cy,hz,ppd}=o,groundA=o.groundA??1,dotsA=o.dotsA??1;
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a1020');gr.addColorStop(1,'#1a2947');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.beginPath();g.rect(0,0,W,groundA>=1?hz:H);g.clip();

  g.globalCompositeOperation='lighter';
  for(const d of DOTS){const y=(d.y+d.v*t)%H,th=Math.hypot(d.x-cx,y-cy)/ppd;let col=null;
    if(o.mode==='red'){if(Math.abs(th-A1[0])<0.32)col=SPEC[0]}
    else if(o.mode==='all'){if(th>A1[6]-0.16&&th<A1[0]+0.16)col=SPEC[clamp(Math.round((A1[0]-th)/(A1[0]-A1[6])*6),0,6)];
      else if(o.secA>0&&th>A2[0]-0.28&&th<A2[6]+0.28)col=SPEC[clamp(Math.round((th-A2[0])/(A2[6]-A2[0])*6),0,6)]}

function headShadow(cx,cy,a,label='shadow of your head',below=true){a*=clamp((H-14-cy)/30);if(a<=0)return;g.globalAlpha=a*0.9;g.fillStyle='#02040a';g.beginPath();g.moveTo(cx-90,H+10);g.lineTo(cx-16,cy+10);g.arc(cx,cy,17,Math.PI,0);g.lineTo(cx+90,H+10);g.closePath();g.fill();g.globalAlpha=1;
  g.globalAlpha=a;g.strokeStyle=ACC;g.lineWidth=3;g.beginPath();g.arc(cx,cy,7,0,7);g.stroke();g.globalAlpha=1;text(label,cx+34,cy+(below?10:10),30,ACC,a,600)}
// ---------- scenes ----------
const SC={};
// 1. hook
SC.hook=(t,B,E,dur)=>{const hz=800,ppd=12,e=18;
  const ox=pw(t,[[B(2),960],[E(2)+0.3,1270]]),cy=hz+e*ppd;

  const walk=seg(t,B(1),B(1)+0.6)*(1-seg(t,E(1),E(1)+0.5)),ph=(t*0.35)%1;
  for(let k=0;k<7;k++){const u=((k+(walk>0?ph:0.4))%7)/7,y=hz+(H-hz)*u*u;line(0,y,W,y,'#1b2a4a',0.9*(0.3+0.7*u),2)}

  chibi(ox,1056+bob,0.30,{a:seg(t,0.3,1.2),q:true});

  text('It never gets closer.',110,170,46,INK,seg(t,B(1)+1.2,B(1)+1.8)*(1-seg(t,B(2)-0.3,B(2))),500);
  text('It follows you.',110,170,46,INK,seg(t,B(2)+0.8,B(2)+1.4)*(1-seg(t,B(3)-0.3,B(3))),500);
  text('Not a thing in the sky.',110,150,50,INK,seg(t,B(3)+0.6,B(3)+1.2)*(1-seg(t,B(4)+2.3,B(4)+2.8)),500);
  text('An angle.',110,220,50,ACC,seg(t,B(3)+2.8,B(3)+3.3)*(1-seg(t,B(4)+2.3,B(4)+2.8)),700);

// 2. one drop, one ray

    g.strokeStyle='#ff5d52';g.lineWidth=6;g.beginPath();g.moveTo(x-58,y-58);g.lineTo(x+58,y+58);g.moveTo(x+58,y-58);g.lineTo(x-58,y+58);g.stroke();
    g.strokeStyle=DROP;g.lineWidth=3;g.beginPath();g.arc(x+250,y,56,0,7);g.stroke();g.globalAlpha=1;
    text('not this',x,y+118,30,QUIET,ia,500,'center');text('this',x+250,y+118,30,INK,ia,600,'center')}
  const p0=clamp((t-(B(0)+1.4))/((B(2)+0.9)-(B(0)+1.4))),p1=seg(t,B(2)+0.9,B(3)+1.0),p2=seg(t,B(4)+0.1,B(4)+1.9),p3=seg(t,B(4)+2.1,B(4)+4.2);

  const lab=(s,x,y,a,al='left',c=INK)=>text(s,x,y,34,c,a,600,al);
  lab('1  bends going in',P[1].x-40,P[1].y-34,seg(t,B(2)+1.4,B(2)+2.0),'right');

  text('(the rest escapes)',P[2].x+36,P[2].y+104,28,QUIET,seg(t,B(3)+2.0,B(3)+2.6),500);

// shared layout for sweep + pile-up
const C3={x:620,y:400},R3=240,GX=1160,GY=820,GW=620,GH=500,YMAX=50;
const gx=b=>GX+b*GW,gy=a=>GY-a/YMAX*GH;

  headShadow(960,cy,seg(t,B(2)+3.6,B(2)+4.4)*(1-seg(t,B(3)-0.3,B(3)+0.3)));
  text('not an object',110,150,44,INK,seg(t,B(0)+0.3,B(0)+0.9)*(1-seg(t,B(1)-0.2,B(1)+0.3)),500);
  text('millions of drops, one angle',110,150,44,INK,seg(t,B(1)+1.2,B(1)+1.8)*(1-seg(t,B(2)-0.2,B(2)+0.3)),500);
  text('sun directly behind you',110,150,44,INK,seg(t,B(2)+1.6,B(2)+2.2)*(1-seg(t,B(3)-0.3,B(3)+0.3)),500);
  text('centre of the bow: the shadow of your head',110,212,44,ACC,seg(t,B(2)+4.4,B(2)+5.0)*(1-seg(t,B(3)-0.3,B(3)+0.3)),600);
  const ea=seg(t,B(3)-0.2,B(3)+0.7);
  if(ea>0){fadeMask(ea*0.82);text('Why It Does That',960,520,120,INK,ea,800,'center');text('the rainbow: 42°',960,610,44,ACC,ea,600,'center')}
  fadeMask(seg(t,dur-1.0,dur-0.1));
};
// ---------- dispatcher ----------
window.renderFrame=function(T){const S=TL.scenes;let s=S[S.length-1];for(const c of S){if(T<c.start+c.dur){s=c;break}}
  const t=T-s.start,B=i=>s.beats[i].start,E=i=>s.beats[i].end;
  g.globalCompositeOperation='source-over';g.globalAlpha=1;g.setLineDash([]);g.fillStyle=BG;g.fillRect(0,0,W,H);
  SC[s.id](t,B,E,s.dur);
  const last=s===S[S.length-1];fadeMask(Math.max(1-seg(t,0,0.4),last?0:seg(t,s.dur-0.35,s.dur)));
};
window.renderThumb=function(){g.globalCompositeOperation='source-over';g.fillStyle=BG;g.fillRect(0,0,W,H);
  const C={x:1400,y:420},R=340;drawDrop(C,R,1);g.globalCompositeOperation='lighter';
  for(let k=0;k<60;k++){const b=0.02+0.97*k/59;const q0=trace(b,NW,C,R);drawRay(q0.pts,[1,0,0,0],SUN,SUN,0.10,2.4);
    [0,3,6].forEach(i=>{const q=trace(b,NS[i],C,R),near=bowAngle(NS[i])-q.ang<1.6;drawRay(q.pts.slice(1),[1,1,1],SPEC[i],SPEC[i],near?0.6:0.08,near?4:2.4)})}
  g.globalCompositeOperation='source-over';
  const gr=g.createLinearGradient(0,0,1050,0);gr.addColorStop(0,'rgba(10,16,32,0.92)');gr.addColorStop(0.7,'rgba(10,16,32,0.75)');gr.addColorStop(1,'rgba(10,16,32,0)');g.fillStyle=gr;g.fillRect(0,0,1050,H);
  text('ALWAYS',90,330,150,INK,1,800);text('42°',80,700,400,ACC,1,800);text('why?',90,890,130,INK,1,700);
};

  word(Wd[0], 520, 380, v === 3 ? 150 : 200, "#F2F5FB"); word(Wd[1], 520, 600, v === 3 ? 150 : 200, v === 2 ? "#FFD45E" : v === 3 ? "#FF8A7A" : "#8CC6FF");
  mascot3(150, 1060, 0.3, 0, { look: [0.8, -0.3], mouth: "o" });
};
